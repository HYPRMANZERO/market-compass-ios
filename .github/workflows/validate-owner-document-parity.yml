name: Validate owner PWA bank document parity
on:
  pull_request:
    branches: [main, release/owner-bank-document-parity-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  document-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - name: Block unreviewed financial-core changes; disclose existing staging drift
        shell: bash
        run: |
          # UI-only PRs must not rewrite source parsing to satisfy an older
          # staging branch. Every financial-core file CHANGED by this PR must
          # still be byte-identical to the protected staging reference.
          # Existing baseline drift is reported, never hidden or rewritten.
          base_ref="${GITHUB_BASE_REF:-main}"
          staging_ref=fix/test-pdf-page-completeness
          if [ "$base_ref" = main ]; then
            staging_ref=feature/ios-safari-launch-2026-11-26
          fi
          git fetch --no-tags origin "$staging_ref"
          staging_sha=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags origin "$base_ref"
          base_sha=$(git rev-parse FETCH_HEAD)
          changed_count=0
          baseline_drift=0
          for name in vehicleFinance documentIntelligence bankStatementParser financialSourceNormalizer standardBankPdfLayout localFinanceDocs localPdfText reviewedDocumentLedger; do
            file="artifacts/market-compass/src/lib/${name}.ts"
            owner=$(git rev-parse "HEAD:${file}")
            base=$(git rev-parse "${base_sha}:${file}")
            staging=$(git rev-parse "${staging_sha}:${file}")
            if [ "$owner" = "$base" ]; then
              if [ "$owner" != "$staging" ]; then
                # Explicit, reviewed 2026-11-23 baseline drift; NOT parity.
                # Changes in EITHER branch invalidate this exception.
                # For non-main bases, strict equality remains required.
                expected_pair=''
                if [ "$base_ref" = main ]; then
                  case "$name" in
                    documentIntelligence) expected_pair='2e50ee8c2d41d58e763c87f7a8a896ef3517296e|fde9367c0d62bc0398a8f84fcba85f5d7c021afe' ;;
                    bankStatementParser) expected_pair='d3029d17d6683227cb5a1d0b57e933f6226e5bfb|e7632366626637a0e5124cde2e11aa1b2b9d6d29' ;;
                    financialSourceNormalizer) expected_pair='23939641027dc957eb5544b522b732b3e3fd1290|312d98680863fc57090083e3640c8a67d21285f1' ;;
                    standardBankPdfLayout) expected_pair='5a78500e121df3f13cbd97095d4cd96b7477e643|b65478786a8b32b133da697efda21347ebae58e6' ;;
                    localFinanceDocs) expected_pair='7d766464399b45ad39fbf5c8aa313394de276e73|545add62264b685f79d723d4dd5ed3b114669532' ;;
                    localPdfText) expected_pair='b4069cab6edc934422b901afa6d8d85273059866|69f1b07bfe6901f4a07e5b95792f04ab030bb5e3' ;;
                    reviewedDocumentLedger) expected_pair='a3bb0d680167af8c7c545553f2a709d3aabb550d|2c4e8fb51f5e0b43f71983aa942907785df66b82' ;;
                  esac
                fi
                if [ "$expected_pair" != "$owner|$staging" ]; then
                  echo "::error file=${file}::Unknown financial-core drift; abort UI release."
                  exit 1
                fi
                baseline_drift=$((baseline_drift+1))
                echo "::warning file=${file}::Pinned pre-existing public/staging drift; reconciliation remains outstanding."
              fi
              continue
            fi
            changed_count=$((changed_count+1))
            if [ "$owner" != "$staging" ]; then
              echo "::error file=${file}::Financial-core change is not byte-identical to protected staging; do not release."
              exit 1
            fi
          done
          echo "Protected finance-core changes verified: ${changed_count}; unchanged baseline differences: ${baseline_drift}."
          if [ "$changed_count" -eq 0 ]; then
            echo "Visual-only change verified: all eight public finance-core files are unchanged from target branch."
          fi
      - run: node --experimental-strip-types --test tests/standard-bank-layout.test.mjs tests/bank-statement-rows.test.mjs tests/financial-source-normalization.test.mjs tests/document-intelligence.test.mjs tests/owner-bank-release-parity.test.mjs
      - run: node --experimental-strip-types --test tests/local-finance-docs.test.mjs tests/local-pdf-intake.test.mjs tests/pdfjs-password-engine.test.mjs tests/reviewed-document-ledger.test.mjs tests/financial-readiness.test.mjs tests/monthly-expenses.test.mjs
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/market-compass run typecheck
      - name: Verify original GitHub Pages build
        env:
          PORT: '5173'
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
        run: pnpm --filter @workspace/market-compass run build
      - run: node scripts/prepare-offline-shell.mjs
      - run: test -f artifacts/market-compass/dist/public/sw.js && test -f artifacts/market-compass/dist/public/index.html
