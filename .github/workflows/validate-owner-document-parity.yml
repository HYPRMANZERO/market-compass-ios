name: Validate owner PWA bank document parity
on:
  push:
    branches: [fix/owner-pdf-page-completeness]
  pull_request:
    branches: [main, release/owner-bank-document-parity-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  document-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - name: Require identical financial source core in owner and staging editions
        shell: bash
        run: |
          # Draft-owner CI compares against the matching protected test PR.
          # Main release PRs compare against the staging feature branch.
          staging_ref=fix/test-pdf-page-completeness
          if [ "${GITHUB_BASE_REF:-}" = main ]; then
            staging_ref=feature/ios-safari-launch-2026-11-26
          fi
          git fetch --no-tags origin "$staging_ref"
          for name in vehicleFinance documentIntelligence bankStatementParser financialSourceNormalizer standardBankPdfLayout localFinanceDocs localPdfText reviewedDocumentLedger; do
            file="artifacts/market-compass/src/lib/${name}.ts"
            owner=$(git rev-parse "HEAD:${file}")
            staging=$(git rev-parse "FETCH_HEAD:${file}")
            if [ "$owner" != "$staging" ]; then
              echo "Financial source core differs between owner and test PWA: $file"
              exit 1
            fi
          done
          echo "Both editions have identical source-normalization and protection code."
      - run: node --experimental-strip-types --test tests/standard-bank-layout.test.mjs tests/bank-statement-rows.test.mjs tests/financial-source-normalization.test.mjs tests/document-intelligence.test.mjs tests/owner-bank-release-parity.test.mjs
      - run: node --experimental-strip-types --test tests/local-finance-docs.test.mjs tests/local-pdf-intake.test.mjs tests/pdfjs-password-engine.test.mjs tests/reviewed-document-ledger.test.mjs tests/financial-readiness.test.mjs tests/monthly-expenses.test.mjs
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/market-compass run typecheck
      - name: Verify original GitHub Pages build
        env:
          PORT: '5173'
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
        run: pnpm --filter @workspace/market-compass run build
      - run: node scripts/prepare-offline-shell.mjs
      - run: test -f artifacts/market-compass/dist/public/sw.js && test -f artifacts/market-compass/dist/public/index.html
