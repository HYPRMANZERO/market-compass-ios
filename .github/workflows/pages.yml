name: Publish Market Compass PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test payment gateway (mock provider only)
        run: node --test workers/payment-gateway/gateway.test.mjs

      - name: Test offline finance and market research assurance
        run: node --experimental-strip-types --test tests/model-assurance.test.mjs
      
      - name: Test offline voice commands and local currency conversion
        run: node --experimental-strip-types --test tests/voice-currency.test.mjs
      - name: Test salary-cycle boundaries and secure local expense accounting
        run: node --experimental-strip-types --test tests/monthly-expenses.test.mjs

      - name: Build shared TypeScript libraries
        run: pnpm run typecheck:libs

      - name: Validate web workspace
        run: pnpm --filter @workspace/market-compass run typecheck

      - name: Build PWA for GitHub Pages
        env:
          PORT: '5173'
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
        run: pnpm --filter @workspace/market-compass run build

      - name: Package offline application shell for iPhone, laptop and desktop
        run: node scripts/prepare-offline-shell.mjs

      - name: Add SPA fallback for GitHub Pages
        run: |
          cp artifacts/market-compass/dist/public/index.html artifacts/market-compass/dist/public/404.html
          touch artifacts/market-compass/dist/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/market-compass/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4