name: Validate Financial Pulse triplicate

on:
  pull_request:
    paths:
      - 'artifacts/market-compass/src/lib/financialPulseForecast.ts'
      - 'artifacts/market-compass/src/components/FinancialPulseMini.tsx'
      - 'artifacts/market-compass/src/components/AssistantMessageText.tsx'
      - 'artifacts/market-compass/src/components/VoiceAssistant.tsx'
      - 'artifacts/market-compass/src/App.tsx'
      - 'tests/financial-pulse-readonly.test.mjs'
      - 'artifacts/market-compass/src/lib/recurringSpendInsights.ts'
      - 'tests/recurring-spend-insights.test.mjs'
      - 'artifacts/market-compass/src/lib/financialPulseGuidance.ts'
      - 'tests/financial-pulse-guidance.test.mjs'
      - '.github/workflows/financial-pulse-triplicate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulse-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run evidence-graded financial calculation tests three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Financial Pulse deterministic regression attempt ${attempt}/3"
            node --experimental-strip-types --test tests/financial-pulse-readonly.test.mjs tests/recurring-spend-insights.test.mjs tests/financial-pulse-guidance.test.mjs
          done
