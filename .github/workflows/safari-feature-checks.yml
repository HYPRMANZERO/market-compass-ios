name: Safari feature checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ios-safari-launch-2026-11-26]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/monthly-expenses.test.mjs
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/market-compass run typecheck
      - name: Build PWA without publishing
        env:
          PORT: '5173'
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
        run: |
          pnpm --filter @workspace/market-compass run build
          node scripts/prepare-offline-shell.mjs
      - name: Confirm service worker push handler is packaged
        run: grep -q "notificationclick" artifacts/market-compass/dist/public/sw.js
