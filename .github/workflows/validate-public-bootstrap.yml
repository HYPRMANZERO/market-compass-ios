name: Validate public Bootstrap PWA release candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/bootstrap-public-parity-20261123]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate public finance and Bootstrap UI
        run: node --test tests/*.test.mjs
      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs
      - name: Typecheck PWA
        run: pnpm --filter @workspace/market-compass run typecheck
      - name: Build public Pages subpath
        env:
          PORT: '5173'
          BASE_PATH: '/market-compass-ios/'
          VITE_MC_EDITION: personal
          NODE_ENV: production
        run: pnpm --filter @workspace/market-compass run build
      - name: Validate offline shell without publishing
        run: |
          node scripts/prepare-offline-shell.mjs
          test -f artifacts/market-compass/dist/public/index.html
          test -f artifacts/market-compass/dist/public/sw.js
          test -f artifacts/market-compass/dist/public/manifest.webmanifest
          grep -q 'mc-wallet-hero' artifacts/market-compass/dist/public/assets/*.css
          grep -Fq '.flex{display:flex}' artifacts/market-compass/dist/public/assets/*.css
          grep -qi 'bootstrap' artifacts/market-compass/src/vendor/bootstrap/LICENSE
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('artifacts/market-compass/dist/public/manifest.webmanifest','utf8'));if(m.name!=='Compass Personal')process.exit(1)"
      - name: Share exact public release bundle with Windows browser tests
        uses: actions/upload-artifact@v4
        with:
          name: compass-public-pages-smoke
          path: artifacts/market-compass/dist/public/
          retention-days: 3
      - name: Build Finance candidate from the same frontend sources
        env:
          BASE_PATH: '/market-compass-ios/'
          VITE_MC_EDITION: finance
          MC_PWA_OUT_DIR: ${{ github.workspace }}/.release/finance
          NODE_ENV: production
        run: |
          pnpm --filter @workspace/market-compass run build
          node scripts/prepare-offline-shell.mjs
          test -f .release/finance/index.html
          test -f .release/finance/sw.js
          grep -Fq '.flex{display:flex}' .release/finance/assets/*.css
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('.release/finance/manifest.webmanifest','utf8'));if(m.name!=='Compass Financial Advisor')process.exit(1)"
      - name: Share exact Finance release bundle with Windows browser tests
        uses: actions/upload-artifact@v4
        with:
          name: compass-finance-smoke
          path: .release/finance/
          include-hidden-files: true
          retention-days: 3

  public-edge-smoke:
    needs: public-static-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install Windows native optional dependencies
        shell: pwsh
        run: |
          Remove-Item Env:NODE_ENV -ErrorAction SilentlyContinue
          pnpm install --frozen-lockfile --force
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      # Do not regenerate Tailwind CSS on Windows. Exercise the exact static
      # bundle built and checked on Linux for the public Pages release.
      - uses: actions/download-artifact@v4
        with:
          name: compass-public-pages-smoke
          path: artifacts/market-compass/dist/public/
      - name: Verify downloaded release CSS and service worker
        shell: pwsh
        run: |
          $dir='artifacts/market-compass/dist/public'
          foreach ($file in @('index.html','sw.js','manifest.webmanifest')) {
            if (!(Test-Path (Join-Path $dir $file))) { throw "Missing public release file: $file" }
          }
          if (!(Select-String -Path (Join-Path $dir 'assets/*.css') -SimpleMatch -Pattern '.flex{display:flex}' -Quiet)) {
            throw 'Public release CSS missing the flex layout utility'
          }
      - name: Synthetic mobile Bootstrap and account smoke
        shell: pwsh
        env:
          BASE_PATH: '/market-compass-ios/'
          VITE_MC_EDITION: personal
          NODE_ENV: production
        run: |
          node scripts/bootstrap-ui-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic Edge UI check failed' }
      - name: Full Personal browser gate three independent times
        shell: pwsh
        env:
          BASE_PATH: '/market-compass-ios/'
          VITE_MC_EDITION: personal
          NODE_ENV: production
        run: |
          foreach ($round in 1..3) {
            Write-Host "Personal browser round $round of 3"
            node scripts/browser-release-gate.mjs
            if ($LASTEXITCODE -ne 0) { throw "Personal browser gate failed in round $round" }
          }
      - name: Personal Spend pagination and encrypted-review browser smoke
        shell: pwsh
        env:
          BASE_PATH: '/market-compass-ios/'
          VITE_MC_EDITION: personal
          NODE_ENV: production
        run: |
          node scripts/category-review-ui-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Personal Spend review browser check failed' }
      - uses: actions/download-artifact@v4
        with:
          name: compass-finance-smoke
          path: .release/finance/
      - name: Smoke-test the protected Finance candidate without rebuilding it
        shell: pwsh
        env:
          BASE_PATH: '/market-compass-ios/'
          VITE_MC_EDITION: finance
          MC_PWA_OUT_DIR: ${{ github.workspace }}/.release/finance
          NODE_ENV: production
        run: |
          node scripts/category-review-ui-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Finance Spend review browser check failed' }

      - name: Full Finance browser gate three independent times
        shell: pwsh
        env:
          BASE_PATH: '/market-compass-ios/'
          VITE_MC_EDITION: finance
          MC_PWA_OUT_DIR: ${{ github.workspace }}/.release/finance
          NODE_ENV: production
        run: |
          foreach ($round in 1..3) {
            Write-Host "Finance browser round $round of 3"
            node scripts/browser-release-gate.mjs
            if ($LASTEXITCODE -ne 0) { throw "Finance browser gate failed in round $round" }
          }
