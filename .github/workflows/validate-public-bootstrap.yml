name: Validate public Bootstrap PWA release candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/bootstrap-public-parity-20261123]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate public finance and Bootstrap UI
        run: node --test tests/*.test.mjs
      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs
      - name: Typecheck PWA
        run: pnpm --filter @workspace/market-compass run typecheck
      - name: Build public Pages subpath
        env:
          PORT: '5173'
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
        run: pnpm --filter @workspace/market-compass run build
      - name: Validate offline shell without publishing
        run: |
          node scripts/prepare-offline-shell.mjs
          test -f artifacts/market-compass/dist/public/index.html
          test -f artifacts/market-compass/dist/public/sw.js
          test -f artifacts/market-compass/dist/public/manifest.webmanifest
          grep -q 'mc-wallet-hero' artifacts/market-compass/dist/public/assets/*.css
          grep -qi 'bootstrap' artifacts/market-compass/src/vendor/bootstrap/LICENSE

  public-edge-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install Windows native optional dependencies
        shell: pwsh
        run: |
          Remove-Item Env:NODE_ENV -ErrorAction SilentlyContinue
          pnpm install --frozen-lockfile --force
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - name: Build public static PWA
        shell: pwsh
        env:
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
          PORT: '5173'
        run: |
          pnpm --filter @workspace/market-compass run build
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          node scripts/prepare-offline-shell.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline cache shell failed' }
      - name: Synthetic mobile Bootstrap and account smoke
        shell: pwsh
        env:
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
        run: |
          node scripts/bootstrap-ui-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic Edge UI check failed' }
