name: Finance Material UI isolated trial
on:
  push:
    branches: [experiment/finance-material-ui-20261126]
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Resolve experimental dependencies (review lock before release)
        run: pnpm install --no-frozen-lockfile
      - name: Regression tests including shared UI fixes
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Typecheck
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/market-compass run typecheck
      - name: Build original Personal without trial
        env:
          BASE_PATH: /market-compass-ios/
          VITE_MC_EDITION: personal
          MC_PWA_OUT_DIR: ${{ github.workspace }}/.release/personal
        run: |
          pnpm --filter @workspace/market-compass run build
          node scripts/prepare-offline-shell.mjs
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('.release/personal/manifest.webmanifest','utf8'));if(m.name!=='Compass Personal')process.exit(1)"
      - name: Build isolated Finance trial
        env:
          BASE_PATH: /market-compass-ios/
          VITE_MC_EDITION: finance
          VITE_MC_MUI_TRIAL: 'true'
          MC_PWA_OUT_DIR: ${{ github.workspace }}/.release/finance-mui
        run: |
          pnpm --filter @workspace/market-compass run build
          node scripts/prepare-offline-shell.mjs
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('.release/finance-mui/manifest.webmanifest','utf8'));if(m.name!=='Compass Financial Advisor')process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: finance-mui-unverified-build
          path: .release/finance-mui
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: mui-resolved-lock
          path: pnpm-lock.yaml
          retention-days: 7
  mobile-browser:
    needs: trial
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/download-artifact@v4
        with:
          name: mui-resolved-lock
          path: .
      - name: Install exact resolved dependency lock
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --force
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - uses: actions/download-artifact@v4
        with:
          name: finance-mui-unverified-build
          path: .release/finance-mui
      - name: Three isolated mobile browser checks using Edge
        shell: pwsh
        env:
          BASE_PATH: /market-compass-ios/
          VITE_MC_EDITION: finance
          VITE_MC_MUI_TRIAL: 'true'
          MC_PWA_OUT_DIR: ${{ github.workspace }}/.release/finance-mui
          MC_TEST_MUI_ONLY: 'true'
        run: |
          for ($round=1; $round -le 3; $round++) {
            node scripts/browser-release-gate.mjs
            if ($LASTEXITCODE -ne 0) { throw "Mobile browser round $round failed" }
            Write-Host "PASS: mobile browser round $round of 3"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: finance-mui-candidate
          path: .release/finance-mui
          retention-days: 7
