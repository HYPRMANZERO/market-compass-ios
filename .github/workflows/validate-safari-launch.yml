name: Validate Safari launch branch
on:
  push:
    branches: [feature/ios-safari-launch-2026-11-26]
  pull_request:
    branches: [main, feature/ios-safari-launch-2026-11-26]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/owner-budget-view.test.mjs tests/ios-speech-voices.test.mjs tests/owner-budget-draft.test.mjs tests/offline-agent-queue.test.mjs
      - run: node --experimental-strip-types --test tests/ios-speech-playback.test.mjs
      - run: node --experimental-strip-types --test tests/monthly-expenses.test.mjs
      - run: node --experimental-strip-types --test tests/home-financial-evidence.test.mjs tests/historical-recurring-insights.test.mjs
      - run: node --test tests/home-document-upload.test.mjs
      - run: node --experimental-strip-types --test tests/private-ai-origin.test.mjs
      - run: node --experimental-strip-types --test tests/financial-source-health.test.mjs
      - run: node --experimental-strip-types --test tests/live-crypto-quotes.test.mjs
      - run: node --experimental-strip-types --test tests/local-finance-docs.test.mjs tests/reviewed-document-ledger.test.mjs tests/mobile-spend-workspace.test.mjs tests/local-pdf-intake.test.mjs tests/pdfjs-password-engine.test.mjs tests/financial-readiness.test.mjs tests/local-launch-guideline.test.mjs tests/offline-owner-budget-analysis.test.mjs tests/iphone-finance-import-access.test.mjs tests/iphone-mobile-shell.test.mjs
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/market-compass run typecheck
      - name: Build static iPhone PWA
        env:
          PORT: '5173'
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
        run: pnpm --filter @workspace/market-compass run build
      - run: node scripts/prepare-offline-shell.mjs
      - name: Verify generated Tailwind layout CSS
        run: node scripts/verify-private-ui-css.mjs
      - name: Verify compiled shell
        run: |
          test -f artifacts/market-compass/dist/public/index.html
          test -f artifacts/market-compass/dist/public/sw.js
          grep -q 'notificationclick' artifacts/market-compass/dist/public/sw.js

  windows-native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install Windows native optional dependencies
        shell: pwsh
        run: |
          Remove-Item Env:NODE_ENV -ErrorAction SilentlyContinue
          pnpm install --frozen-lockfile --force
          if ($LASTEXITCODE -ne 0) { throw 'pnpm Windows install failed' }
      - name: Verify Tailwind Windows native binding
        shell: pwsh
        run: |
          node -e "require('./node_modules/.pnpm/@tailwindcss+oxide@4.3.3/node_modules/@tailwindcss/oxide'); console.log('Tailwind Oxide native binding OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Tailwind Windows native module could not load' }
      - name: Build iPhone PWA on Windows
        shell: pwsh
        env:
          PORT: '5173'
          BASE_PATH: '/market-compass-ios/'
          NODE_ENV: production
        run: |
          pnpm --filter @workspace/market-compass run build
          if ($LASTEXITCODE -ne 0) { throw 'Windows Vite build failed' }
          node scripts/prepare-offline-shell.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline shell failed' }
          node scripts/verify-private-ui-css.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows production CSS missing Tailwind layout utilities' }
          if (-not (Test-Path 'artifacts/market-compass/dist/public/index.html')) { throw 'No built index.html' }
